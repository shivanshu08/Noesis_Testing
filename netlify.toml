[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/frontend/browser"

[[redirects]]
  from = "/api/*"
  to = "https://noesis-manager-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
