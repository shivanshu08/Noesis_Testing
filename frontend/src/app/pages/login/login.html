<p-toast position="top-center"></p-toast>

<div class="login-page">
  <div class="login-container">
    <!-- Left Illustration Panel -->
    <div class="login-left">
      <div class="illustration-content">
        <img src="assets/images/login/login-illustration.png" alt="Secure Login" class="login-illustration" />
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="login-right">
      <p-card styleClass="login-card">
        <!-- Login Form -->
        <div class="card-header">
          <h2>Noesis Login</h2>
        </div>

        <div class="form-field">
          <label for="username">Username</label>
          <p-inputgroup>
            <p-inputgroup-addon>
              <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <input pInputText id="username" [(ngModel)]="username" placeholder="User login ID" (keydown.enter)="onLogin()" />
          </p-inputgroup>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <p-inputgroup>
            <p-inputgroup-addon>
              <i class="pi pi-lock"></i>
            </p-inputgroup-addon>
            <input pInputText id="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="Password" (keydown.enter)="onLogin()" />
            <p-inputgroup-addon class="toggle-pw" (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </p-inputgroup-addon>
          </p-inputgroup>
        </div>

        <p-button label="Log in" [loading]="loading()" (onClick)="onLogin()" styleClass="w-full login-btn" />
      </p-card>
    </div>
  </div>

  <!-- Footer -->
  <footer class="login-footer">
    <span>Drogevate &copy; {{ currentYear }}. All rights reserved.</span>
  </footer>
</div>
