<div class="login-page">
  <div class="login-container">
    <!-- Left Illustration Panel -->
    <div class="login-left">
      <div class="illustration-content">
        <img src="assets/images/login/login-illustration.png" alt="Secure Login" class="login-illustration" />
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="login-right">
      <p-card styleClass="login-card">
        @if (!isRegister()) {
          <!-- Login Form -->
          <div class="card-header">
            <h2>Noesis Login</h2>
          </div>

          @if (error()) {
            <p-message severity="error" [text]="error()" styleClass="w-full mb-4" />
          }

          <div class="form-field">
            <label for="username">Username</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-user"></i>
              </p-inputgroup-addon>
              <input pInputText id="username" [(ngModel)]="username" placeholder="User login ID" (keydown.enter)="onLogin()" />
            </p-inputgroup>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-lock"></i>
              </p-inputgroup-addon>
              <input pInputText id="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="Password" (keydown.enter)="onLogin()" />
              <p-inputgroup-addon class="toggle-pw" (click)="showPassword = !showPassword">
                <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
              </p-inputgroup-addon>
            </p-inputgroup>
          </div>

          <div class="form-field">
            <div class="remember-row">
              <p-checkbox [(ngModel)]="rememberMe" [binary]="true" inputId="remember" />
              <label for="remember" class="remember-label">Remember me</label>
            </div>
          </div>

          <p-button label="Log in" [loading]="loading()" (onClick)="onLogin()" styleClass="w-full login-btn" />

          <p-divider />

          <div class="toggle-mode">
            <span>Don't have an account?</span>
            <a (click)="toggleMode()" class="toggle-link">Create Account</a>
          </div>
        } @else {
          <!-- Register Form -->
          <div class="card-header">
            <h2>Create Account</h2>
            <p class="subtitle">Sign up to get started</p>
          </div>

          @if (error()) {
            <p-message severity="error" [text]="error()" styleClass="w-full mb-4" />
          }

          <div class="form-field">
            <label for="fullName">Full Name</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-id-card"></i>
              </p-inputgroup-addon>
              <input pInputText id="fullName" [(ngModel)]="fullName" placeholder="Enter your full name" />
            </p-inputgroup>
          </div>

          <div class="form-field">
            <label for="regUsername">Username</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-user"></i>
              </p-inputgroup-addon>
              <input pInputText id="regUsername" [(ngModel)]="username" placeholder="Choose a username" />
            </p-inputgroup>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-envelope"></i>
              </p-inputgroup-addon>
              <input pInputText id="email" [(ngModel)]="email" placeholder="Enter your email" type="email" />
            </p-inputgroup>
          </div>

          <div class="form-field">
            <label for="regPassword">Password</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-lock"></i>
              </p-inputgroup-addon>
              <input pInputText id="regPassword" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="Create password (min 6 chars)" />
              <p-inputgroup-addon class="toggle-pw" (click)="showPassword = !showPassword">
                <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
              </p-inputgroup-addon>
            </p-inputgroup>
          </div>

          <div class="form-field">
            <label for="confirmPassword">Confirm Password</label>
            <p-inputgroup>
              <p-inputgroup-addon>
                <i class="pi pi-lock"></i>
              </p-inputgroup-addon>
              <input pInputText id="confirmPassword" [(ngModel)]="confirmPassword" type="password" placeholder="Confirm password" (keydown.enter)="onRegister()" />
            </p-inputgroup>
          </div>

          <p-button label="Create Account" icon="pi pi-user-plus" [loading]="loading()" (onClick)="onRegister()" styleClass="w-full login-btn" />

          <p-divider />

          <div class="toggle-mode">
            <span>Already have an account?</span>
            <a (click)="toggleMode()" class="toggle-link">Sign In</a>
          </div>
        }
      </p-card>
    </div>
  </div>

  <!-- Footer -->
  <footer class="login-footer">
    <span>Drogevate &copy; {{ currentYear }}. All rights reserved.</span>
  </footer>
</div>
