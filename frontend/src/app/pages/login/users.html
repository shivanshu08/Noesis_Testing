<div style="background: var(--surface-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--surface-border); box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2 style="margin: 0; color: var(--text-color);">User Management</h2>
    <p-button label="New User" icon="pi pi-plus" (onClick)="openNew()"></p-button>
  </div>

  <p-table [value]="users()" [loading]="loading()" responsiveLayout="scroll" [rows]="10" [paginator]="true" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>User</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th style="width: 8rem; text-align: center;">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <p-avatar [image]="user.avatar_url || undefined" [label]="!user.avatar_url ? (user.full_name?.charAt(0) || 'U') : ''" shape="circle" [style]="{ 'background': 'linear-gradient(135deg, var(--p-primary-500), var(--p-primary-400))', 'color': '#fff' }"></p-avatar>
            <span style="font-weight: 600; color: var(--text-color);">{{user.username}}</span>
          </div>
        </td>
        <td>{{user.full_name}}</td>
        <td>{{user.email}}</td>
        <td>
          <p-tag [value]="user.role | titlecase" [severity]="user.role === 'admin' ? 'danger' : (user.role === 'tester' ? 'info' : 'success')"></p-tag>
        </td>
        <td>
          <p-tag [value]="user.is_active ? 'Active' : 'Inactive'" [severity]="user.is_active ? 'success' : 'danger'"></p-tag>
        </td>
        <td style="display: flex; gap: 0.5rem; justify-content: center;">
          <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" (onClick)="editUser(user)"></p-button>
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteUser(user)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="userDialog" [style]="{width: '550px'}" [header]="isEdit ? 'Edit User Details' : 'Create New User'" [modal]="true" styleClass="p-fluid" [draggable]="false">
  <div style="display: flex; flex-direction: column; gap: 1.5rem; padding-top: 1rem;">
    
    <!-- Profile Photo Section -->
    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <p-avatar [image]="userForm.avatarUrl || undefined" [label]="!userForm.avatarUrl ? (userForm.fullName?.charAt(0) || 'U') : ''" shape="circle" [style]="{ width: '64px', height: '64px', 'font-size': '1.75rem', 'background': 'linear-gradient(135deg, var(--p-primary-500), var(--p-primary-400))', 'color': '#fff' }"></p-avatar>
      <div style="display: flex; gap: 0.5rem;">
        <input type="file" #fileInput accept="image/*" style="display: none;" (change)="onFileSelect($event)" />
        <p-button label="Upload Photo" icon="pi pi-upload" severity="secondary" (onClick)="fileInput.click()"></p-button>
        @if (userForm.avatarUrl) {
          <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="userForm.avatarUrl = ''" pTooltip="Remove Photo" />
        }
      </div>
    </div>

    <div style="display: flex; gap: 1rem;">
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color);">Full Name</label>
        <p-inputgroup>
          <p-inputgroup-addon><i class="pi pi-id-card"></i></p-inputgroup-addon>
          <input type="text" pInputText [(ngModel)]="userForm.fullName" placeholder="e.g. John Doe" required />
        </p-inputgroup>
      </div>
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color);">Username</label>
        <p-inputgroup>
          <p-inputgroup-addon><i class="pi pi-user"></i></p-inputgroup-addon>
          <input type="text" pInputText [(ngModel)]="userForm.username" placeholder="e.g. jdoe" required [disabled]="isEdit" />
        </p-inputgroup>
      </div>
    </div>

    <div style="display: flex; gap: 1rem;">
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color);">Email Address</label>
        <p-inputgroup>
          <p-inputgroup-addon><i class="pi pi-envelope"></i></p-inputgroup-addon>
          <input type="email" pInputText [(ngModel)]="userForm.email" placeholder="john@company.com" required />
        </p-inputgroup>
      </div>
      <div style="flex: 1;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color);">Role</label>
        <p-select [options]="roles" [(ngModel)]="userForm.role" optionLabel="label" optionValue="value" appendTo="body"></p-select>
      </div>
    </div>

    @if (!isEdit) {
      <div>
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color);">Temporary Password</label>
        <p-password [(ngModel)]="userForm.password" [toggleMask]="true" placeholder="Assign a secure password" styleClass="w-full" inputStyleClass="w-full" [style]="{ width: '100%' }" [inputStyle]="{ width: '100%' }"></p-password>
      </div>
    }

    <div style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--surface-border);">
      <p-checkbox [(ngModel)]="userForm.isActive" [binary]="true" inputId="isActive"></p-checkbox>
      <label for="isActive" style="color: var(--text-color); cursor: pointer; font-weight: 500;">Active Account (Can Login)</label>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="userDialog = false"></p-button>
    <p-button label="Save" icon="pi pi-check" (onClick)="saveUser()"></p-button>
  </ng-template>
</p-dialog>

<p-confirmDialog [style]="{width: '400px'}"></p-confirmDialog>
