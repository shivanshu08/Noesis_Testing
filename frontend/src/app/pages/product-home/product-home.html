<section class="product-page">
  <header class="page-header">
    <div class="title-group">
      <span class="product-icon"><i [class]="icon"></i></span>
      <div><span class="eyebrow">NOESIS MANAGER</span><h1>{{title}}</h1><p>{{description}}</p></div>
    </div>
  </header>
  <div class="workspace-canvas" aria-label="Blank {{title}} workspace">
    <div class="canvas-watermark"><span class="watermark-icon"><i [class]="icon"></i></span><span>{{title}}</span></div>
  </div>
</section>
