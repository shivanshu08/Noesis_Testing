<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Brain/Circuit icon -->
  <circle cx="100" cy="90" r="45" stroke="url(#grad1)" stroke-width="4" fill="none"/>
  <!-- Circuit lines from brain -->
  <path d="M65 60 L45 40 M45 40 L30 40 M45 40 L45 25" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 60 L155 40 M155 40 L170 40 M155 40 L155 25" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 120 L45 140 M45 140 L30 140 M45 140 L45 155" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M135 120 L155 140 M155 140 L170 140 M155 140 L155 155" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <!-- Side lines -->
  <path d="M55 90 L25 90" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M145 90 L175 90" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  <!-- Circuit dots -->
  <circle cx="30" cy="40" r="4" fill="url(#grad1)"/>
  <circle cx="45" cy="25" r="4" fill="url(#grad1)"/>
  <circle cx="170" cy="40" r="4" fill="url(#grad1)"/>
  <circle cx="155" cy="25" r="4" fill="url(#grad1)"/>
  <circle cx="30" cy="140" r="4" fill="url(#grad1)"/>
  <circle cx="45" cy="155" r="4" fill="url(#grad1)"/>
  <circle cx="170" cy="140" r="4" fill="url(#grad1)"/>
  <circle cx="155" cy="155" r="4" fill="url(#grad1)"/>
  <circle cx="25" cy="90" r="4" fill="url(#grad1)"/>
  <circle cx="175" cy="90" r="4" fill="url(#grad1)"/>
  <!-- Inner brain detail -->
  <path d="M85 75 Q100 65 115 75 M80 90 Q100 80 120 90 M85 105 Q100 95 115 105" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Center dot -->
  <circle cx="100" cy="90" r="5" fill="url(#grad1)"/>
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="url(#grad1)">DROGEVATE</text>
</svg>
